# ============================================================================
# VS Code Workspace-Einstellungen für das Projekt "testautomatisierung"
# ============================================================================
#
# VERWENDUNG IN EINER ANDEREN VS CODE INSTANZ:
# ---------------------------------------------
# Diese Datei dokumentiert die VS Code Konfiguration des Projekts.
# Die eigentlichen Einstellungen liegen im Ordner .vscode/ und werden
# automatisch übernommen, sobald der Workspace geöffnet wird:
#
#   1. Repository klonen oder Projektordner kopieren
#   2. In VS Code: Datei → Ordner öffnen → diesen Projektordner wählen
#   3. Der Ordner .vscode/ enthält settings.json, launch.json und
#      extensions.json – diese werden automatisch geladen.
#   4. VS Code zeigt eine Meldung zu empfohlenen Extensions an →
#      "Alle installieren" klicken.
#
# Alternativ Extensions manuell installieren:
#   code --install-extension ms-python.python
#   code --install-extension ms-python.debugpy
#   code --install-extension ms-python.vscode-pylance
#
# ============================================================================

# --- Workspace Settings (.vscode/settings.json) ---
[settings]
"chat.tools.terminal.autoApprove" = true
"python.testing.pytestEnabled" = true
"python.testing.unittestEnabled" = false
"python.testing.pytestArgs" = ["tests"]

# --- Empfohlene Extensions (.vscode/extensions.json) ---
[extensions.recommendations]
extensions = [
    "ms-python.python",
    "ms-python.debugpy",
    "ms-python.vscode-pylance",
]

# --- Debug-Konfigurationen (.vscode/launch.json) ---

[launch.configurations.debug-current-file]
name = "Python Debugger: Current File"
type = "debugpy"
request = "launch"
program = "${file}"
cwd = "${workspaceFolder}"
console = "integratedTerminal"
envFile = "${workspaceFolder}/.env"
justMyCode = true

[launch.configurations.pytest-current-file]
name = "Python: pytest (aktuelle Datei)"
type = "debugpy"
request = "launch"
module = "pytest"
args = ["${file}", "-v"]
cwd = "${workspaceFolder}"
console = "integratedTerminal"
envFile = "${workspaceFolder}/.env"
justMyCode = true

[launch.configurations.pytest-all]
name = "Python: pytest (alle Tests)"
type = "debugpy"
request = "launch"
module = "pytest"
args = ["tests", "-v"]
cwd = "${workspaceFolder}"
console = "integratedTerminal"
envFile = "${workspaceFolder}/.env"
justMyCode = true
